{{/*
One shared Ingress (ALB) routing per-service paths to their Services.
Enabled via .Values.ingress.enabled. Uses the AWS Load Balancer Controller.
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sunrise
  labels:
    app.kubernetes.io/part-of: sunrise
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range $name, $cfg := .Values.services }}
          {{- if $cfg.enabled }}
          - path: {{ $cfg.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: 80
          {{- end }}
          {{- end }}
{{- end }}
