{{/* One ClusterIP Service per enabled service, fronting its pods. */}}
{{- range $name, $cfg := .Values.services }}
{{- if $cfg.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "sunrise.labels" (dict "svc" $name "root" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sunrise.selectorLabels" (dict "svc" $name "root" $) | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
