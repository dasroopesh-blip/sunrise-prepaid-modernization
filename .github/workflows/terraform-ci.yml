name: Terraform CI

# Runs on pull requests that touch the Terraform code, and on pushes to main.
# Implements the Phase 1 DevOps goal: automated fmt / validate / plan gates.
on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"

# Least-privilege token; OIDC role assumption used for the plan step.
permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: "1.9.5"
  AWS_REGION: "us-east-1"

jobs:
  # ---------------------------------------------------------------------------
  # 1. fmt — one check for the whole tree (fast, no cloud creds needed).
  # ---------------------------------------------------------------------------
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Check formatting
        run: terraform fmt -check -recursive infra/terraform

  # ---------------------------------------------------------------------------
  # 2. validate — per environment, no backend/creds needed (-backend=false).
  #    Matrix runs dev, staging, prod in parallel.
  # ---------------------------------------------------------------------------
  validate:
    name: validate (${{ matrix.env }})
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging, prod]
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      # init without a backend so no S3/DynamoDB access is required just to validate.
      - name: Terraform init (no backend)
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate -no-color

  # ---------------------------------------------------------------------------
  # 3. plan — real plan against AWS. Requires an OIDC role (AWS_ROLE_ARN secret).
  #    Only runs on pull_request. Steps self-skip if the secret is not set.
  #    NOTE: `secrets.*` cannot be used in job-level `if:`, so we promote it to
  #    an env var (HAS_AWS) and gate the steps on that instead.
  # ---------------------------------------------------------------------------
  plan:
    name: plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging, prod]
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ matrix.env }}
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Detect AWS credentials
        id: creds
        run: |
          if [ -n "${AWS_ROLE_ARN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.creds.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        if: steps.creds.outputs.enabled == 'true'
        run: terraform init

      - name: Terraform plan
        if: steps.creds.outputs.enabled == 'true'
        # Secrets injected as TF_VAR_* so nothing sensitive lives in the repo.
        env:
          TF_VAR_dms_source_password: ${{ secrets.DMS_SOURCE_PASSWORD }}
          TF_VAR_dms_target_password: ${{ secrets.DMS_TARGET_PASSWORD }}
        run: terraform plan -no-color -input=false

      - name: Note when plan is skipped
        if: steps.creds.outputs.enabled != 'true'
        run: echo "AWS_ROLE_ARN secret not set - skipping cloud plan. fmt + validate still gate the PR."
